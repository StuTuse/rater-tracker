<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rater &amp; Tracker 邮箱验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#faf8ef;color:#373c32;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#faf8ef" background="https://raw.githubusercontent.com/StuTuse/rater-tracker/main/assets/generated/journal-pattern.png" style="width:100%;background-color:#faf8ef;background-position:center top;background-size:680px 680px;">
    <tr>
      <td align="center" style="padding:44px 16px 38px;">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" bgcolor="#fffef9" style="width:100%;max-width:520px;background-color:#fffef9;border:1px solid #e8dfc2;border-radius:20px;">
          <tr>
            <td align="center" style="padding:36px 24px 25px;">
              <img src="https://raw.githubusercontent.com/StuTuse/rater-tracker/main/assets/app.png" width="88" height="88" alt="Rater &amp; Tracker" style="display:block;width:88px;height:88px;border:0;">
              <div style="padding-top:19px;color:#373c32;font-size:25px;font-weight:600;letter-spacing:-.5px;line-height:1.35;">Rater &amp; Tracker</div>
              <div style="padding-top:8px;color:#9b8241;font-size:13px;font-weight:700;letter-spacing:2px;line-height:1.4;">TuseCreation</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:4px 25px 20px;">
              <div style="color:#8f8c75;font-size:12px;font-weight:600;letter-spacing:2px;line-height:1.5;">邮箱验证码</div>
              <div style="padding:12px 0 10px;color:#8d6b1d;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;font-size:48px;font-weight:700;letter-spacing:10px;line-height:1.25;">{{.VerificationCode}}</div>
              <div style="color:#74745e;font-size:14px;line-height:1.8;">完成邮箱验证，继续记录你的成长</div>
              <div style="padding-top:5px;color:#999883;font-size:12px;line-height:1.7;">验证码有效期 {{.ExpireMinutes}} 分钟</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:18px 24px 25px;border-top:1px solid #eee9d8;color:#989783;font-size:12px;line-height:1.8;">
              如果这不是你发起的操作，请忽略此邮件。<br>
              为保护账号安全，请勿向他人透露验证码。
            </td>
          </tr>
        </table>
        <div style="padding-top:19px;color:#999783;font-size:11px;letter-spacing:.4px;line-height:1.6;">Rater &amp; Tracker · TuseCreation</div>
      </td>
    </tr>
  </table>
</body>
</html>
