<div id="rt-refined-preview">

    <section data-variant="手机底栏" aria-label="手机底栏布局" hidden><div class="rr-stage"><div class="rr-app" data-device="phone" aria-label="手机底栏与任务操作"></div></div></section>
  </div>
  <style>
    #rt-refined-preview{color-scheme:light dark}
    #rt-refined-preview *{box-sizing:border-box}

    #rt-refined-preview .rr-app{--rr-bg:light-dark(#faf8f0,#24251f);--rr-card:light-dark(#fffef8,#30312a);--rr-ink:light-dark(#414a38,#eeeeda);--rr-muted:light-dark(#70745f,#b9bba3);--rr-line:light-dark(#e5dfcb,#545440);--rr-gold:light-dark(#ebc75c,#d4b349);--rr-soft:light-dark(#f7ebbb,#51492d);--rr-green:light-dark(#71845a,#b0bf91);--rr-shadow:light-dark(#665d2310,#00000020);--rr-veil:light-dark(#353c2f50,#00000090);font:14px/1.55 'Segoe UI','Microsoft YaHei',sans-serif;background:var(--rr-bg);color:var(--rr-ink);border:1px solid var(--rr-line);border-radius:22px;max-width:1000px;width:100%;height:790px;position:relative;isolation:isolate;display:grid;grid-template-columns:100px minmax(0,1fr);overflow:hidden;container-type:inline-size;--rr-gap:12px}

    #rt-refined-preview h1,#rt-refined-preview h2,#rt-refined-preview h3,#rt-refined-preview p{margin:0}
    #rt-refined-preview h1{font-size:22px;font-weight:500}
    #rt-refined-preview h2{font-size:16px;font-weight:500}

    #rt-refined-preview .rr-brand{display:grid;place-items:center;width:40px;height:40px;border-radius:14px 17px 12px 16px;rotate:-5deg;background:var(--rr-gold);color:light-dark(#54461e,#322b12);font-size:23px}

    #rt-refined-preview .rr-level{display:grid;place-items:center;align-content:center;flex:none;width:44px;height:46px;border-radius:15px;background:var(--rr-soft);font-weight:500}

    #rt-refined-preview .rr-meter span{display:block;width:46.15%;height:100%;border-radius:inherit;background:var(--rr-gold)}

    @container(max-width:700px){#rt-refined-preview .rr-recall{grid-template-columns:minmax(0,1fr);gap:12px}#rt-refined-preview .rr-recall-summary{border-left:0;border-top:1px solid var(--rr-line);padding:14px 0 4px}}
    @container(max-width:560px){#rt-refined-preview .rr-task-stack{grid-template-columns:1fr}#rt-refined-preview .rr-layout{gap:12px}#rt-refined-preview .rr-grid{grid-template-columns:1fr}#rt-refined-preview .rr-app[data-device=tablet] .rr-nav button{flex-direction:column;font-size:11px;padding:5px 0}#rt-refined-preview .rr-app[data-device=tablet]{grid-template-columns:54px minmax(0,1fr)}#rt-refined-preview .rr-app[data-device=tablet] .rr-main{padding-inline:12px}}
    @media(prefers-reduced-motion:reduce){#rt-refined-preview *{animation:none!important;transition:none!important}}
  </style>
  <script>
  (()=>{
    const root=document.getElementById('rt-refined-preview');
    const dims=[['study','学习','book-open',3],['work','作品','pencil-line',4],['health','健康','heart',2],['life','生活','sprout',3]];
    const nav=[['today','今日','sun'],['tasks','任务','list-checks'],['history','历史','chart-no-axes-combined'],['rewards','奖励','award'],['settings','设置','settings']];
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stamp=()=>{const d=new Date();return{iso:d.toISOString(),display:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)};};
    const saved=window.openai?.widgetState?.modelContent?.preview;
    const scoreOK=n=>n===null||(Number.isInteger(n)&&n>=0&&n<=5);
    const models=[];
    const xp=m=>dims.reduce((sum,[key])=>sum+5+2*m.scores[key],0);
    const remember=m=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:{overall:m.scores.overall,note:m.note}},privateContent:null}).catch(()=>{});};
    function rating(m,key,label,ico,overall=false){const n=m.scores[key];return `<section class="rr-card rr-rating ${overall?'rr-overall':''}" data-rating="${key}" aria-label="${label}"><div class="rr-card-head"><i data-lucide="${ico}" aria-hidden="true"></i><h2>${label}</h2></div><button class="rr-zero" data-zero="${key}" aria-label="${label}零星" aria-pressed="${n===0}">0 星</button><div class="rr-stars" role="group" aria-label="${label}星级">${Array.from({length:5},(_,i)=>`<button data-score="${key}" data-value="${i+1}" aria-label="${label}${i+1}星" aria-pressed="${n!==null&&i<n}">★</button>`).join('')}</div>${overall?`<textarea class="rr-note" aria-label="今日小结" placeholder="记下今天的一件小事…" maxlength="4000">${esc(m.note)}</textarea>`:`<details><summary aria-label="${label}原因与依据">原因与依据</summary><textarea class="rr-note" aria-label="${label}原因与依据" placeholder="简单记两句…"></textarea></details>`}</section>`;}
    function taskCard(m,t){return `<article class="rr-card rr-task-card" data-task-card="${t.id}"><button class="rr-task-open" data-task-open="${t.id}" aria-label="查看${t.title}完整详情"><strong>${esc(t.title)}</strong><small>${esc(t.type)}</small></button><div class="rr-task-meta"><span>${t.completed?'已完成':'正在进行'}</span><span>${esc(t.deadline)}</span></div><div class="rr-task-progress">${t.stages?`<div class="rr-meter" role="progressbar" aria-label="${t.title}阶段完成进度" aria-valuemin="0" aria-valuemax="${t.stages.total}" aria-valuenow="${t.stages.done}"><span style="width:${t.stages.done/t.stages.total*100}%"></span></div><span>阶段 ${t.stages.done} / ${t.stages.total}</span>`:`<span>推进 ${t.logs.length} 次 · ${t.logs.length?'最近 '+esc(t.logs[0].when):'尚无推进记录'}</span>`}</div><div class="rr-task-actions">${t.completed?'<small>成果已保存</small>':`<button class="rr-secondary" data-progress="${t.id}">推进</button><button class="rr-primary" data-complete="${t.id}">完成</button>`}</div></article>`;}
    function today(m){return `<div class="rr-heading"><h1>今日记录</h1><small>10 月 18 日 · 周日</small></div><div class="rr-layout"><section aria-label="评分区">${rating(m,'overall','今日评分','notebook-pen',true)}<div class="rr-grid">${dims.map(([key,label,ico])=>rating(m,key,label,ico)).join('')}</div></section><aside aria-label="当前任务与进度"><div class="rr-panel-head"><h2>当前任务</h2><button data-page="tasks">全部 →</button></div><div class="rr-task-stack">${m.tasks.map(t=>taskCard(m,t)).join('')}</div></aside></div>`;}
    const series=[['overall','总体','light-dark(#bd9026,#eac75e)'],['study','学习','light-dark(#71845a,#b0bf91)'],['work','作品','light-dark(#b78350,#dab08b)'],['health','健康','light-dark(#8b9b67,#c2cd9f)'],['life','生活','light-dark(#5d8982,#9ec1b9)']];
    const sampleDays={
      '2026-10-12':{overall:3,study:2,work:3,health:4,life:3,summary:'给这一周开了个头。',notes:{study:'阅读了两章，整理出三个问题。',work:'列好短片提纲。',health:'散步半小时，晚上早点休息。',life:'收拾桌面和房间。'}},
      '2026-10-13':{overall:null,study:3,work:4,health:3,life:2,summary:'',notes:{study:'完成练习并复盘错题。',work:'拍摄补充镜头。',health:'做了一组拉伸。',life:'只处理了必要家务。'}},
      '2026-10-14':{overall:2,study:2,work:3,health:0,life:3,summary:'工作比较满，今天没有锻炼。',notes:{study:'复习了昨天的笔记。',work:'整理采访素材。',health:'没有运动，按实际情况记录为0星。',life:'和朋友吃了顿晚饭。'}},
      '2026-10-16':{overall:4,study:4,work:3,health:4,life:4,summary:'确定了短片的结构，状态不错。',notes:{study:'阅读并写了一页理解。',work:'完成脚本结构。',health:'运动后做了恢复。',life:'给家人打了电话。'}},
      '2026-10-17':{overall:4,study:4,work:4,health:3,life:4,summary:'粗剪完成，明天继续细化。',notes:{study:'完成本周练习，整理容易混淆的概念。',work:'整理素材并完成粗剪，节奏基本成形。',health:'散步和拉伸，给身体留出恢复时间。',life:'整理工作台，为下一天留出空间。'}}
    };
    const dateShift=(date,n)=>new Date(Date.parse(date+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
    function dayData(m,date){return date==='2026-10-18'?{...m.scores,summary:m.note,notes:{study:'阅读与练习都完成了计划。',work:'完成了短片初剪，并记录下一轮修改意见。',health:'散步和拉伸，留了一些时间休息。',life:'整理房间，也和朋友聊了一会儿。'}}:sampleDays[date];}
    function monthCalendar(m){const first=m.historyMonth+'-01',d=new Date(first+'T00:00:00Z'),offset=(d.getUTCDay()+6)%7,days=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();return `<section class="rr-calendar" aria-label="评分日历"><div class="rr-calendar-head"><button data-history-month="-1" aria-label="上个月">‹</button><h3>${m.historyMonth.replace('-',' 年 ')} 月</h3><button data-history-month="1" aria-label="下个月" ${m.historyMonth>='2026-10'?'disabled':''}>›</button></div><div class="rr-calendar-grid">${['一','二','三','四','五','六','日'].map(w=>`<span class="rr-weekday">${w}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const date=m.historyMonth+'-'+String(i+1).padStart(2,'0');return `<button data-history-date="${date}" aria-label="查看${date}评分" aria-pressed="${m.historyDate===date}" ${date==='2026-10-18'?'aria-current="date"':''} data-has-record="${!!dayData(m,date)}" ${date>'2026-10-18'?'disabled':''}>${i+1}</button>`;}).join('')}</div></section>`;}
    function reviewCard(label,ico,n,note,overall=false){return `<section class="rr-card rr-review-card ${overall?'rr-review-overall':''}" aria-label="历史${label}"><div class="rr-review-head"><h3><i data-lucide="${ico}" aria-hidden="true"></i>${label}</h3><span class="rr-review-stars" aria-label="${n===null||n===undefined?'未评分':n+'星'}">${n===null||n===undefined?'—':'★'.repeat(n)+'☆'.repeat(5-n)}${n!==null&&n!==undefined?`<small>${n} 星</small>`:''}</span></div>${note?`<p>${esc(note)}</p>`:'<small>—</small>'}</section>`;}
    function dailyReview(m){const day=dayData(m,m.historyDate);return `<section class="rr-day-review" aria-label="所选日期评分" data-selected-date="${m.historyDate}"><div class="rr-heading"><h2>四项评分与依据</h2><button data-demo="历史更正入口预览，当前只回看示例数据">更正记录</button></div>${day?`<div class="rr-grid">${dims.map(([key,label,ico])=>reviewCard(label,ico,day[key],day.notes[key])).join('')}</div>`:'<div class="rr-card rr-empty-day">这一天还没有评分记录。</div>'}</section>`;}
    function recall(m){const day=dayData(m,m.historyDate);return `<section class="rr-card rr-recall" aria-label="日期与当天概览">${monthCalendar(m)}<div class="rr-recall-summary"><small>所选日期</small><h2>${m.historyDate.replaceAll('-',' / ')}</h2>${day?reviewCard('总体评分与小结','notebook-pen',day.overall,day.summary,true):'<p>—</p>'}</div></section>`;}
    function history(m){return `<div class="rr-history"><div class="rr-heading"><h1>历史记录</h1></div><section class="rr-card rr-history-chart" aria-label="每日评分趋势"><div class="rr-chart-head"><h2>每日评分趋势</h2><div class="rr-chart-range" role="group" aria-label="趋势范围">${[7,30].map(n=>`<button data-history-range="${n}" aria-pressed="${m.historyRange===n}">${n} 天</button>`).join('')}</div></div><div class="rr-chart-toggles" role="group" aria-label="趋势序列">${series.map(([key,label,color])=>`<button data-history-series="${key}" style="--rr-series:${color}" aria-pressed="${m.historySeries[key]}">${label}</button>`).join('')}</div><div class="rr-chart-host" aria-label="每日星级曲线"></div></section>${recall(m)}${dailyReview(m)}</div>`;}
    function drawHistory(m){const host=m.el.querySelector('.rr-chart-host');if(!host)return;const width=Math.max(200,host.clientWidth),height=m.el.dataset.device==='phone'?230:250,pad={left:30,right:16,top:18,bottom:35},start=dateShift(m.historyEnd,-m.historyRange+1),dates=Array.from({length:m.historyRange},(_,i)=>dateShift(start,i)),x=i=>pad.left+i*(width-pad.left-pad.right)/(dates.length-1),y=n=>height-pad.bottom-n*(height-pad.top-pad.bottom)/5;
      let chart=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${m.historyRange}天评分趋势，空白断线，0星保留零点"><title>每日评分趋势</title><desc>横轴是日期，纵轴是0至5星。点击有记录的点查看当天评分与依据。</desc>`;
      for(let n=0;n<=5;n++)chart+=`<path class="rr-chart-guideline" d="M${pad.left} ${y(n)}H${width-pad.right}"/><text x="8" y="${y(n)+4}">${n}</text>`;
      const selected=dates.indexOf(m.historyDate);if(selected>=0)chart+=`<path class="rr-chart-selected" d="M${x(selected)} ${pad.top}V${height-pad.bottom}"/>`;
      const tickCount=width<400?3:5;for(let j=0;j<tickCount;j++){const i=Math.round(j*(dates.length-1)/(tickCount-1));chart+=`<text x="${x(i)}" y="${height-10}" text-anchor="${j===0?'start':j===tickCount-1?'end':'middle'}">${dates[i].slice(5).replace('-','/')}</text>`;}
      for(const [key,label,color]of [...series.slice(1),series[0]]){if(!m.historySeries[key])continue;let path='',pen=false,points='';dates.forEach((date,i)=>{const n=dayData(m,date)?.[key];if(n===null||n===undefined){pen=false;return;}path+=`${pen?'L':'M'}${x(i)} ${y(n)} `;pen=true;points+=`<g><title>${date} ${label} ${n}星</title><circle class="rr-chart-dot" cx="${x(i)}" cy="${y(n)}" r="3"/><circle data-chart-date="${date}" cx="${x(i)}" cy="${y(n)}" r="8" fill="transparent"/></g>`;});chart+=`<g style="--rr-series:${color}" data-line-series="${key}"><path class="rr-series-line" data-series="${key}" d="${path}"/>${points}</g>`;}
      host.innerHTML=chart+'</svg>';
    }
    const historyObserver=new ResizeObserver(entries=>{for(const entry of entries){const m=models.find(item=>item.el.contains(entry.target));if(m)drawHistory(m);}});
    function paintHistory(m){const main=m.el.querySelector('.rr-main'),scroll=main.scrollTop;m.el.querySelector('.rr-page').innerHTML=history(m);icons();drawHistory(m);historyObserver.disconnect();for(const item of models){const host=item.el.querySelector('.rr-chart-host');if(host)historyObserver.observe(host);}main.scrollTop=scroll;}
    function page(m){if(m.page==='today')return today(m);if(m.page==='history')return history(m);if(m.page==='tasks')return `<div class="rr-heading"><h1>任务</h1><small>正在进行</small></div><div class="rr-task-list">${m.tasks.map(t=>taskCard(m,t)).join('')}</div>`;if(m.page==='settings')return `<div class="rr-heading"><h1>设置</h1></div><section class="rr-card rr-settings"><div class="rr-setting"><div><h3>账号与同步</h3><small>登录后同步成长记录</small></div><button data-dialog="login">登录</button></div><div class="rr-setting"><div><h3>软件更新</h3><small>启动后在后台检查</small></div><button data-dialog="update">预览提示</button></div><div class="rr-setting"><div><h3>完整备份</h3><small>保存全部成长记录</small></div><button data-demo="备份入口示意">导出</button></div></section>`;return `<div class="rr-heading"><h1>奖励中心</h1></div><section class="rr-card rr-settings"><div class="rr-setting"><span>等级</span><span>Lv.8</span></div><div class="rr-setting"><span>今日四项评分经验</span><span>${xp(m)} XP</span></div><div class="rr-setting"><span>徽章</span><span>六系列 · 48枚</span></div></section>`;}
    function icons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18,'stroke-width':1.6}});}
    function paint(m){m.el.innerHTML=`<aside class="rr-rail"><div class="rr-brand" aria-label="Rater & Tracker">✦</div><nav class="rr-nav" aria-label="主导航">${nav.map(([key,label,ico])=>`<button data-page="${key}" ${m.page===key?'aria-current="page"':''}><i data-lucide="${ico}" aria-hidden="true"></i><span>${label}</span></button>`).join('')}</nav><button class="rr-account" data-dialog="login" aria-label="打开登录界面">登录</button></aside><main class="rr-main"><header class="rr-top"><strong>Rater & Tracker</strong><span class="rr-status">示例预览</span></header>${m.page==='history'?'':`<section class="rr-growth" aria-label="示例等级经验"><div class="rr-level"><small>Lv.</small>8</div><div class="rr-growth-body"><div class="rr-growth-line"><span>成长进度</span><span>30 / 65 XP</span></div><div class="rr-meter"><span></span></div><div class="rr-growth-line"><span>距 Lv.9 还需 35 XP</span><span data-day-xp>今日 ${xp(m)} XP</span></div></div></section>`}<div class="rr-page">${page(m)}</div></main>`;icons();if(m.page==='history'){drawHistory(m);const host=m.el.querySelector('.rr-chart-host');historyObserver.observe(host);}}
    function toast(m,message){m.el.querySelector('.rr-toast')?.remove();const t=document.createElement('div');t.className='rr-toast';t.setAttribute('role','status');t.textContent=message;m.el.append(t);clearTimeout(m.timer);m.timer=setTimeout(()=>t.remove(),2300);}
    function recent(t,all=false){return t.logs.slice(0,all?t.logs.length:2).map(log=>`<div class="rr-recent-row"><time>${esc(log.when)}</time><p>${esc(log.note)}</p></div>`).join('')||'<small>暂无推进记录</small>';}
    function open(m,kind,id){m.el.querySelector('.rr-shade')?.remove();const t=m.tasks.find(task=>task.id===id)??m.tasks[0];const now=stamp();m.activeTask=t.id;m.activeKind=kind;
      const heading={progress:'记录推进',complete:'完成任务',detail:'任务详情',login:'欢迎使用',update:'发现新版本'}[kind];
      const taskIntro=`<h3 class="rr-dialog-title">${esc(t.title)}</h3><div class="rr-dialog-meta"><span>${esc(t.type)}</span><span>${t.completed?'已完成':'正在进行'}</span></div>`;
      let content;
      if(kind==='progress'||kind==='complete')content=`${taskIntro}<div class="rr-time"><span>${kind==='progress'?'记录时间':'完成时间'}</span><time datetime="${now.iso}" data-recorded-time>${now.display}</time></div>${kind==='progress'?`<section class="rr-recent"><h3>最近推进</h3>${recent(t)}</section>`:''}<label class="rr-field">成果说明<textarea class="rr-note" aria-label="成果说明" placeholder="${kind==='progress'?'这次完成了什么？':'记录最终交付的成果'}" rows="2" maxlength="4000">${esc(m.drafts[kind+'/'+t.id]??'')}</textarea></label><div class="rr-dialog-actions"><button data-close>取消</button><button class="rr-primary" data-save-action>${kind==='progress'?'保存推进':'确认完成'}</button></div>`;
      else if(kind==='detail')content=`${taskIntro}<p><small>目标：完成一版可观看的短片，并整理修改意见。</small></p><section class="rr-detail-section"><h3>任务进度</h3><small>${t.stages?`已完成阶段 ${t.stages.done} / ${t.stages.total}`:`有效推进 ${t.logs.length} 次`}</small></section><details class="rr-detail-section" open><summary>推进历史</summary>${recent(t,true)}<button data-demo="历史补记入口示意，可在完整详情选择过去的实际日期">补记／更正记录</button></details><details class="rr-detail-section"><summary>计划与奖励明细</summary><small>计划日期、阶段管理、冻结额度与经验账本集中在此处。</small></details><details class="rr-detail-section rr-management"><summary>任务管理</summary><button data-demo="归档确认入口示意，未修改任务">放弃并归档</button><button data-demo="删除整段推进历史的确认入口示意，未删除数据">删除整个任务推进历史</button><button data-demo="删除任务的确认入口示意，未删除数据">删除整个任务</button></details><div class="rr-dialog-actions"><button data-close>关闭</button></div>`;
      else if(kind==='update')content='<p>当前版本还有最新版本</p><div class="rr-dialog-actions"><button data-close>稍后再说</button><button class="rr-primary" data-demo="更新提示预览，不下载文件">下载最新版本</button></div>';
      else content='<p><small>登录账号，在设备之间同步成长记录。</small></p><label class="rr-field">账号<input autocomplete="off" placeholder="示例账号，请勿填真实凭据"></label><label class="rr-field">密码<input type="password" autocomplete="off" placeholder="仅供界面预览"></label><div class="rr-dialog-actions"><button data-close>暂不登录</button><button class="rr-primary" data-demo="登录入口预览，不连接账号">登录</button></div>';
      const shade=document.createElement('div');shade.className='rr-shade';shade.innerHTML=`<section class="rr-dialog" role="dialog" aria-modal="true" aria-label="${heading}"><div class="rr-dialog-head"><h2>${heading}</h2><button data-close aria-label="关闭">×</button></div>${content}</section>`;m.previousFocus=document.activeElement;m.el.append(shade);shade.querySelector('[data-close]').focus();}
    function close(m){m.el.querySelector('.rr-shade')?.remove();m.previousFocus?.focus();}
    root.querySelectorAll('.rr-app').forEach(el=>{const m={el,page:'history',historyDate:'2026-10-18',historyMonth:'2026-10',historyEnd:'2026-10-18',historyRange:7,historySeries:Object.fromEntries(series.map(([key])=>[key,true])),scores:{overall:scoreOK(saved?.overall)?saved.overall:3,...Object.fromEntries(dims.map(([key,,,n])=>[key,n]))},note:typeof saved?.note==='string'?saved.note.slice(0,4000):'完成了短片初剪，也给自己留了一点休息时间。',drafts:{},tasks:[{id:'film',title:'完成短片初剪',type:'中任务 · 作品',deadline:'今天到期',stages:{done:2,total:5},logs:[{when:'10/17',note:'整理素材并完成粗剪'},{when:'10/16',note:'确定结构与脚本'}]},{id:'reading',title:'阅读与笔记',type:'长期任务 · 学习',deadline:'10/30 到期',stages:null,logs:[]}]};models.push(m);paint(m);
      el.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!el.contains(b))return;
        if(b.dataset.page){m.page=b.dataset.page;paint(m);return;}
        if(b.dataset.historyRange){m.historyRange=Number(b.dataset.historyRange);paintHistory(m);return;}
        if(b.dataset.historySeries){m.historySeries[b.dataset.historySeries]=!m.historySeries[b.dataset.historySeries];paintHistory(m);return;}
        if(b.dataset.historyMonth){const d=new Date(m.historyMonth+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(b.dataset.historyMonth));m.historyMonth=d.toISOString().slice(0,7);paintHistory(m);return;}
        if(b.dataset.historyDate){m.historyDate=b.dataset.historyDate;m.historyMonth=m.historyDate.slice(0,7);if(m.historyDate<m.historyEnd&&m.historyDate>=dateShift(m.historyEnd,-m.historyRange+1)){}else m.historyEnd=m.historyDate;paintHistory(m);return;}
        const key=b.dataset.score??b.dataset.zero;if(key){m.scores[key]=b.dataset.zero?0:Number(b.dataset.value);const card=b.closest('[data-rating]');card.querySelectorAll('[data-score]').forEach(star=>star.setAttribute('aria-pressed',Number(star.dataset.value)<=m.scores[key]));card.querySelector('[data-zero]').setAttribute('aria-pressed',m.scores[key]===0);el.querySelector('[data-day-xp]').textContent=`今日 ${xp(m)} XP`;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)b.animate([{transform:'scale(1)'},{transform:'scale(1.12)',offset:.4},{transform:'scale(1)'}],{duration:330,easing:'cubic-bezier(.22,.8,.25,1)'});remember(m);return;}
        if(b.dataset.progress){open(m,'progress',b.dataset.progress);return;}

        if(b.dataset.demo)toast(m,b.dataset.demo);
      });
      el.addEventListener('click',event=>{const point=event.target.closest('[data-chart-date]');if(!point)return;m.historyDate=point.dataset.chartDate;m.historyMonth=m.historyDate.slice(0,7);paintHistory(m);});
      el.addEventListener('input',event=>{if(event.target.matches('.rr-overall textarea')){m.note=event.target.value;remember(m);}if(event.target.matches('.rr-dialog textarea')){m.drafts[m.activeKind+'/'+m.activeTask]=event.target.value;event.target.setCustomValidity('');}});
      el.addEventListener('keydown',event=>{const shade=el.querySelector('.rr-shade');if(!shade)return;if(event.key==='Escape'){event.preventDefault();close(m);}if(event.key==='Tab'){const nodes=[...shade.querySelectorAll('button,input,textarea,summary')].filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
      if(globalThis.Tweak){const design={gap:12};const tweak=new Tweak({container:el,onChange:()=>el.style.setProperty('--rr-gap',design.gap+'px')});tweak.addSlider(design,'gap',{label:'评分模块间距',min:8,max:16,unit:'px'});}
    });
