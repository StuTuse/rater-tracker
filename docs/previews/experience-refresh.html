  <script>
  (()=>{
    const root=document.getElementById('rt-experience-preview');
    const dims=[['study','学习','book-open',3],['work','作品','pencil-line',4],['health','健康','heart',2],['life','生活','sprout',3]];
    const nav=[['today','今日','sun'],['tasks','任务','list-checks'],['history','历史','chart-no-axes-combined'],['rewards','奖励','award'],['settings','设置','settings']];
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const saved=window.openai?.widgetState?.modelContent?.preview;
    const validScore=n=>n===null||(Number.isInteger(n)&&n>=0&&n<=5);
    const models=[];
    function remember(model){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:{overall:model.scores.overall,note:model.note}},privateContent:null}).catch(()=>{});}
    function scoreCard(model,key,label,ico,overall=false){
      const n=model.scores[key];
      return `<section class="rt-card ${overall?'rt-overall':''}" data-rating="${key}" aria-label="${label}"><div class="rt-card-head"><i data-lucide="${ico}" aria-hidden="true"></i><h2>${label}</h2><small>${overall?'总体自评':`${5+2*n} XP`}</small></div><div class="rt-scoreline"><button class="rt-zero" data-zero="${key}" aria-label="${label}零星" aria-pressed="${n===0}">0 星</button><div class="rt-stars" role="group" aria-label="${label}星级">${Array.from({length:5},(_,i)=>`<button data-score="${key}" data-value="${i+1}" aria-label="${label}${i+1}星" aria-pressed="${n!==null&&i<n}">★</button>`).join('')}</div><span class="rt-value">${n===null?'未评分':`${n} / 5`}</span></div>${overall?`<textarea class="rt-note" aria-label="今日小结" placeholder="记下今天的一件小事…" maxlength="4000">${esc(model.note)}</textarea>`:`<details class="rt-details"><summary>原因与依据</summary><textarea class="rt-note" aria-label="${label}原因与依据" placeholder="简单记两句…"></textarea></details>`}</section>`;
    }
    function today(model){return `<div class="rt-page-head"><h1>今日记录</h1><span class="rt-date">10 月 18 日 · 周日</span></div>${scoreCard(model,'overall','今日评分','notebook-pen',true)}<div class="rt-grid">${dims.map(([key,label,ico])=>scoreCard(model,key,label,ico)).join('')}</div><section class="rt-tasks"><div class="rt-section-head"><h2>今日任务</h2><button data-page="tasks">查看全部 →</button></div><div class="rt-task"><i data-lucide="circle" aria-hidden="true"></i><span>完成短片初剪</span><small>今天到期</small><button data-progress>记录</button></div><div class="rt-task"><i data-lucide="circle" aria-hidden="true"></i><span>阅读与笔记</span><small>进行中</small></div></section>`;}
    function history(model){const end=model.scores.overall===null?'':`<path class="rt-line-overall" d="M250 84 L300 ${184-model.scores.overall*32}"/><circle cx="300" cy="${184-model.scores.overall*32}" r="4"/>`;return `<div class="rt-page-head"><h1>历史记录</h1><span class="rt-date">最近 7 天</span></div><section class="rt-card"><div class="rt-section-head"><h2>评分趋势</h2><small>星级 · 0—5</small></div><div class="rt-legend"><b>今日总体评分</b><b>学习</b></div><svg class="rt-chart" viewBox="0 0 340 220" role="img" aria-label="示例趋势：今日总体评分独立成线，10月15日未记录并留空"><path class="rt-chart-grid" d="M30 24H316 M30 104H316 M30 184H316"/><text x="8" y="28">5</text><text x="8" y="108">2.5</text><text x="8" y="188">0</text><path class="rt-line-study" d="M30 120 L75 88 L120 120 L165 56 L210 88 L255 56 L300 ${184-model.scores.study*32}"/><path class="rt-line-overall" d="M30 88 L75 56 L120 88 M210 120 L250 84"/>${end}<text x="30" y="211">10/12</text><text x="145" y="211">10/15</text><text x="270" y="211">10/18</text></svg></section><section class="rt-card rt-history-note"><small>10 月 18 日 · 今日小结</small><p>${esc(model.note||'还没有写下今天的小结')}</p><small>总体评分 ${model.scores.overall===null?'未记录':`${model.scores.overall} 星`} · 四项评分 ${model.scores.study+model.scores.work+model.scores.health+model.scores.life} 星</small></section>`;}
    function settings(){return `<div class="rt-page-head"><h1>设置</h1></div><section class="rt-card"><div class="rt-setting"><div><h3>账号与同步</h3><small>登录后同步成长记录</small></div><button data-dialog="login">登录</button></div><div class="rt-setting"><div><h3>数据备份</h3><small>完整 JSON 记录</small></div><button data-demo="正式版继续保留完整备份">导出</button></div><div class="rt-setting"><div><h3>软件更新</h3><small>启动后在后台检查</small></div><button data-dialog="update">预览提示</button></div><div class="rt-setting"><div><h3>动画反馈</h3><small>连续位移，轻盈落定</small></div><button data-demo="跟随系统减少动态偏好">完整</button></div></section>`;}
    function pageContent(model){if(model.page==='today')return today(model);if(model.page==='history')return history(model);if(model.page==='settings')return settings();if(model.page==='tasks')return `<div class="rt-page-head"><h1>任务</h1><button class="rt-primary" data-progress>＋ 新建</button></div><section class="rt-card"><h2>完成短片初剪</h2><div class="rt-task"><span>进行中</span><small>今天到期</small><button data-progress>记录推进</button></div></section>`;return `<div class="rt-page-head"><h1>奖励中心</h1></div><section class="rt-card"><h2>我的成长</h2><div class="rt-setting"><span>等级</span><span>Lv.8</span></div><div class="rt-setting"><span>今日四项评分经验</span><span>${xp(model)} XP</span></div><div class="rt-setting"><span>徽章</span><span>六个系列 · 48 枚</span></div></section>`;}
    const xp=model=>dims.reduce((sum,[key])=>sum+(model.scores[key]===null?0:5+2*model.scores[key]),0);
    function icons(el){globalThis.lucide?.createIcons({root:el,attrs:{width:18,height:18,'stroke-width':1.6}});}
    function paint(model){model.el.innerHTML=`<aside class="rt-rail"><div class="rt-brand" aria-label="Rater & Tracker">✦</div><nav class="rt-nav" aria-label="主导航">${nav.map(([key,label,ico])=>`<button data-page="${key}" ${model.page===key?'aria-current="page"':''}><i data-lucide="${ico}" aria-hidden="true"></i><span>${label}</span></button>`).join('')}</nav><button class="rt-account" data-dialog="login" aria-label="打开登录界面">登录</button></aside><main class="rt-main"><header class="rt-top"><strong>Rater & Tracker</strong><span class="rt-status">示例预览</span></header><section class="rt-growth" aria-label="示例等级经验"><div class="rt-level"><small>Lv.</small>8</div><div class="rt-growth-body"><div class="rt-growth-labels"><span>成长进度</span><span>30 / 65 XP</span></div><div class="rt-meter"><span></span></div><div class="rt-growth-labels"><span>距离 Lv.9 还需 35 XP</span><span data-day-xp>今日 ${xp(model)} XP</span></div></div></section><div class="rt-page">${pageContent(model)}</div></main>`;icons(model.el);}
    function toast(model,message){model.el.querySelector('.rt-toast')?.remove();const t=document.createElement('div');t.className='rt-toast';t.setAttribute('role','status');t.textContent=message;model.el.append(t);clearTimeout(model.toastTimer);model.toastTimer=setTimeout(()=>t.remove(),2400);}
    function dialog(model,kind){model.el.querySelector('.rt-shade')?.remove();const shade=document.createElement('div');shade.className='rt-shade';shade.innerHTML=`<section class="rt-dialog" role="dialog" aria-modal="true" aria-label="${kind==='update'?'更新提示预览':kind==='progress'?'记录推进预览':'首次登录引导预览'}"><div class="rt-dialog-head"><h2>${kind==='update'?'发现新版本':kind==='progress'?'记录推进':'欢迎使用'}</h2><button data-close aria-label="关闭">×</button></div>${kind==='update'?'<p>当前版本还有最新版本</p><p>新版本可下载后安装，现有记录会保留。</p><button class="rt-primary" data-demo="此处为更新交互预览，不下载文件">下载最新版本</button><div class="rt-dialog-footer"><button data-close>稍后再说</button></div>':kind==='progress'?'<label>本次成果<textarea class="rt-note" aria-label="本次成果" placeholder="记录这次完成的内容"></textarea></label><button class="rt-primary" data-fake-save>保存推进</button>':'<p>登录账号，让成长记录在设备之间同步。</p><label>账号<input autocomplete="off" aria-label="示例账号" placeholder="输入账号"></label><label>密码<input type="password" autocomplete="off" aria-label="示例密码" placeholder="仅供预览，请勿填写真实密码"></label><button class="rt-primary" data-demo="这是登录引导预览，不连接账号">登录</button><div class="rt-dialog-footer"><button data-demo="注册入口预览">注册账号</button><button data-close>暂不登录，直接使用</button></div>'}</section>`;model.el.append(shade);model.previousFocus=document.activeElement;shade.querySelector('[data-close]').focus();}
    function closeDialog(model){model.el.querySelector('.rt-shade')?.remove();model.previousFocus?.focus();}
    root.querySelectorAll('.rt-app').forEach(el=>{
      const model={el,page:'today',scores:{overall:validScore(saved?.overall)?saved.overall:4,...Object.fromEntries(dims.map(([key,,,n])=>[key,n]))},note:typeof saved?.note==='string'?saved.note.slice(0,4000):'完成了短片初剪，也给自己留了一点休息时间。',toastTimer:null};models.push(model);paint(model);
      el.addEventListener('click',event=>{
        const b=event.target.closest('button');if(!b||!el.contains(b))return;
        if(b.dataset.page){model.page=b.dataset.page;paint(model);return;}
        const key=b.dataset.score??b.dataset.zero;
        if(key){model.scores[key]=b.dataset.zero?0:Number(b.dataset.value);const card=b.closest('[data-rating]');card.querySelectorAll('[data-score]').forEach(star=>star.setAttribute('aria-pressed',Number(star.dataset.value)<=model.scores[key]));card.querySelector('[data-zero]').setAttribute('aria-pressed',model.scores[key]===0);card.querySelector('.rt-value').textContent=`${model.scores[key]} / 5`;if(key!=='overall')card.querySelector('.rt-card-head small').textContent=`${5+2*model.scores[key]} XP`;el.querySelector('[data-day-xp]').textContent=`今日 ${xp(model)} XP`;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)b.animate([{transform:'scale(1)'},{transform:'scale(1.16)',offset:.4},{transform:'scale(1)'}],{duration:360,easing:'cubic-bezier(.22,.8,.25,1)'});toast(model,key==='overall'?'总体评分已记录 · 经验不变':'评分反馈预览');remember(model);return;}
        if(b.dataset.dialog){dialog(model,b.dataset.dialog);return;}
        if(b.hasAttribute('data-progress')){dialog(model,'progress');return;}
        if(b.hasAttribute('data-close')){closeDialog(model);return;}
        if(b.hasAttribute('data-fake-save')){closeDialog(model);toast(model,'推进反馈预览');return;}
        if(b.dataset.demo)toast(model,b.dataset.demo);
      });
      el.addEventListener('input',event=>{if(event.target.matches('.rt-overall textarea')){model.note=event.target.value;remember(model);}});
      el.addEventListener('keydown',event=>{const shade=el.querySelector('.rt-shade');if(!shade)return;if(event.key==='Escape'){event.preventDefault();closeDialog(model);}if(event.key==='Tab'){const focusable=[...shade.querySelectorAll('button,input,textarea')],first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
      if(globalThis.Tweak){const design={gap:14,radius:16};const tweak=new Tweak({container:el,onChange:()=>{el.style.setProperty('--rt-gap',design.gap+'px');el.style.setProperty('--rt-radius',design.radius+'px');}});tweak.addSlider(design,'gap',{label:'组件间距',min:8,max:22,unit:'px'});tweak.addSlider(design,'radius',{label:'卡片圆角',min:10,max:22,unit:'px'});}
    });
    window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.modelContent?.preview;if(!next)return;models.forEach(model=>{if(validScore(next.overall))model.scores.overall=next.overall;if(typeof next.note==='string')model.note=next.note.slice(0,4000);paint(model);});});
  })();
  </script>
</div>
